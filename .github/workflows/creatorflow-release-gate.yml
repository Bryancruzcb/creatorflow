name: CreatorFlow release gate

# Dispatch-only, and it needs a manifest that main deliberately does not carry: which manifest
# represents this repository is a product decision (#123). Fixture manifests live on
# claude/release-gate-fixture-dispatch, one complete and one unresolved — dispatch with --ref that
# branch and pass one of them as the manifest input.
#
# First exercised 2026-08-05 UTC, runs 30972362753 and 30972465476. Every step ran, on Temurin
# 24.0.2: the complete manifest went green end to end, and the unresolved one recorded exit 2, still
# uploaded its report, and failed at "Enforce result" — the gate refusing a release, which is the
# point of it. Nothing in this file needed changing to make that work.

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative CreatorFlow manifest path
        required: true
        default: creatorflow-manifest.json

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the manifest to exist
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest }}
        run: |
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "::error::No manifest at '$MANIFEST_PATH'. Export one from the desktop release workflow and commit it, or generate one with ManifestCli (repeat --exclude for fixture/vendor directories, e.g. --exclude stress-fixtures) and pass its path as the 'manifest' input."
            exit 1
          fi

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          # Must track maven.compiler.release in the parent pom, which #92 raised to 24 for
          # JavaFX 26. A JDK cannot compile --release above its own version, so this pin being
          # one behind meant the gate died at "Build release-gate CLI" before it ever read a
          # manifest, and nothing caught it because the workflow had never been dispatched. The
          # first dispatch (see the note at the top) built and read a manifest, so the pin is now
          # known good rather than assumed good — but only for release 24.
          java-version: "24"
          cache: maven

      - name: Build release-gate CLI
        run: mvn -B -q -pl core package dependency:copy-dependencies -DincludeScope=runtime

      - name: Evaluate manifest
        id: gate
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest }}
        run: |
          set +e
          java -cp 'core/target/classes:core/target/dependency/*' \
            creatorflow.manifest.ReleaseGateCli \
            "$MANIFEST_PATH" --output core/target/creatorflow-gate-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: creatorflow-gate-report
          path: core/target/creatorflow-gate-report.json
          if-no-files-found: warn

      - name: Enforce result
        shell: bash
        run: test '${{ steps.gate.outputs.exit_code }}' -eq 0
