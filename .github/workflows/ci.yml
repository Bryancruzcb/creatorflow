name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  # The Open Cloud key store encrypts at rest with Windows DPAPI, and its tests are
  # @EnabledOnOs(WINDOWS): the ubuntu job above skips them silently, so encryption-at-rest was
  # never actually exercised anywhere in CI. This job runs the desktop module on Windows so it is.
  #
  # Core is installed without running its suite — the ubuntu job already covers it, and
  # ProjectScannerTest's followed-symlink case needs privileges a Windows runner does not grant.
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Install core into the local repository
        run: mvn -B -pl core -am install -DskipTests
      - name: Desktop tests (includes the Windows-only DPAPI key store)
        run: mvn -B -pl desktop test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Schema parity and typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome
      - name: E2E tests
        run: npm run test:e2e
      # The seven standing gates in frontend/audit. They had never run here: every one of them was
      # only ever exercised by somebody remembering to run it locally, which for a quality gate is
      # indistinguishable from not having it. `audit/README.md` makes the point itself — a gate that
      # is off catches nothing.
      - name: Audit gates
        run: npm run test:audit

  # The dispatch workflow does not run on a push. This job does. The passing fixture must exit 0,
  # so a BLOCKED result fails the push. The blocked fixture must exit 2. If the gate accepts it,
  # the push fails.
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Build release-gate CLI
        run: mvn -B -q -pl core package dependency:copy-dependencies -DincludeScope=runtime
      - name: Passing fixture must clear the gate
        run: |
          java -cp 'core/target/classes:core/target/dependency/*' \
            creatorflow.manifest.ReleaseGateCli \
            .github/fixtures/release-gate/creatorflow-manifest.json \
            --output core/target/creatorflow-gate-report.json
      - name: Blocked fixture must fail the gate
        shell: bash
        run: |
          set +e
          java -cp 'core/target/classes:core/target/dependency/*' \
            creatorflow.manifest.ReleaseGateCli \
            .github/fixtures/release-gate/creatorflow-manifest-blocked.json \
            --output core/target/creatorflow-gate-report-blocked.json
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "::error::Blocked fixture exited $code. Expected 2. A BLOCKED manifest the gate accepts fails this push."
            exit 1
          fi
