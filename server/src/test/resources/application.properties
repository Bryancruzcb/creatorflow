spring.datasource.url=jdbc:h2:mem:registry-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Mirrors the shipped default so the suite exercises the real routing posture.
spring.web.resources.add-mappings=false

# Deliberately NOT setting creatorflow.legacy-registry.enabled here: leaving it unset is what
# exercises the matchIfMissing=false path the shipped default relies on. The two legacy tests
# turn the flag on themselves.

# effectively disable request throttling for the hermetic test suite
creatorflow.ratelimit.capacity=1000000
