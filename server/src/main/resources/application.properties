# CreatorFlow server — self-hosted team provenance store (Phase E)
server.port=8080

# Fresh H2 file, deliberately NOT the old .creatorflow-server path: PR-1 dropped the
# gallery/disputes/uploads entities, and ddl-auto=update can add tables but never drops
# the orphaned ones. A new location starts clean instead of carrying dead schema forward.
# AUTO_SERVER lets tools inspect the database while the server is running.
spring.datasource.url=jdbc:h2:file:${user.home}/.creatorflow-team/registry;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# This server serves JSON only. Without this, Spring's static-resource handler is mapped at
# /** and quietly answers any unmatched path — including /api/** ones — which would let a
# classpath static resource bypass the deny-by-default rule in SecurityConfig. No handler,
# no bypass: unmatched paths become a clean 404.
spring.web.resources.add-mappings=false

# The pre-redirect similarity judge (POST /api/v1/verify, /api/v1/assets*, mappings).
# Off by default: a fresh server serves no copied/not-copied verdict. Set to true only
# to keep the frozen Rojo plugin (roblox-plugin/src/) working against this server.
creatorflow.legacy-registry.enabled=false

# Per-client request throttling on /api/** (token bucket per IP):
# capacity is the burst allowance, per-second the sustained refill rate.
creatorflow.ratelimit.capacity=120
creatorflow.ratelimit.per-second=2.0
